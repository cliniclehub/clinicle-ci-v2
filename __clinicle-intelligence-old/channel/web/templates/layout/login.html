    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 z-[200] bg-surface-50 dark:bg-surface-950 flex items-center justify-center hidden">
        <div class="w-full max-w-sm mx-4">
            <div class="flex flex-col items-center mb-8">
                <!-- Reverse-on-light/dark mark: brand guide forbids the primary
                     color mark on a dark background, so the two anchor dots swap
                     to white in dark mode; the mint accent dot never changes. -->
                <svg role="img" aria-label="Clinicle Intelligence" viewBox="0 0 100 100" width="56" height="56" class="mb-4">
                    <circle cx="20" cy="62" r="9" class="fill-[#4DB8F0] dark:fill-white"/>
                    <circle cx="50" cy="44" r="13" class="fill-[#2E9FDC] dark:fill-white"/>
                    <circle cx="80" cy="56" r="8" fill="#5EDEC8"/>
                </svg>
                <h1 class="font-display text-xl font-bold text-surface-800 dark:text-surface-100">Clinicle Intelligence</h1>
                <p class="text-sm text-surface-500 dark:text-surface-400 mt-1" id="login-subtitle">Enter password to access the console</p>
            </div>
            <form id="login-form" class="space-y-4" onsubmit="return false;">
                <div class="relative">
                    <input id="login-password" type="password" autocomplete="current-password"
                           placeholder="Password"
                           class="w-full px-4 py-3 rounded-xl border border-surface-200 dark:border-white/10
                                  bg-white dark:bg-surface-900 text-surface-800 dark:text-surface-200
                                  placeholder-surface-400 dark:placeholder-surface-500
                                  focus:outline-none focus:ring-2 focus:ring-primary-400/50 focus:border-primary-400
                                  transition-all duration-150 text-sm">
                    <button type="button" id="login-toggle-pwd"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-surface-400 hover:text-surface-600
                                   dark:hover:text-surface-300 cursor-pointer transition-colors"
                            onclick="toggleLoginPassword()">
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
                <p id="login-error" class="text-sm text-red-500 hidden"></p>
                <button id="login-btn" type="submit"
                        class="w-full py-3 rounded-xl bg-primary-500 hover:bg-primary-600 text-white font-medium
                               text-sm cursor-pointer transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                    Login
                </button>
            </form>
        </div>
    </div>
