            <!-- Top Header -->
            <header class="h-14 flex items-center gap-3 px-4 border-b border-surface-200 dark:border-white/10 bg-white dark:bg-surface-900 flex-shrink-0 z-10">
                <!-- Mobile menu toggle -->
                <button id="menu-toggle" class="lg:hidden p-2 rounded-lg hover:bg-surface-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        onclick="toggleSidebar()">
                    <i class="fas fa-bars text-surface-600 dark:text-surface-300"></i>
                </button>

                <!-- Session panel toggle -->
                <button id="session-toggle-btn" class="p-2 rounded-lg hover:bg-surface-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        onclick="toggleSessionPanel()">
                    <i class="fas fa-clock-rotate-left text-surface-500 dark:text-surface-400"></i>
                </button>

                <!-- Workspace panel toggle (chat view only) -->
                <button id="workspace-toggle-btn" class="p-2 rounded-lg hover:bg-surface-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        onclick="toggleWorkspacePanel()" data-tip-key="nav_workspace" data-tooltip="Workspace" data-tooltip-pos="bottom">
                    <i class="fas fa-folder-tree text-surface-500 dark:text-surface-400"></i>
                </button>

                <!-- Message navigator toggle (chat view only; shown once there are questions to jump between) -->
                <button id="timeline-toggle-btn" class="timeline-empty p-2 rounded-lg hover:bg-surface-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        data-tooltip-pos="bottom">
                    <i class="fas fa-list-ul text-surface-500 dark:text-surface-400"></i>
                </button>

                <!-- Breadcrumb (hidden on mobile, and in the chat view where it only repeats "Chat") -->
                <div id="header-breadcrumb" class="hidden lg:flex items-center gap-2 text-sm min-w-0" style="display: none">
                    <span id="breadcrumb-group" class="text-surface-400 dark:text-surface-500 truncate" data-i18n="nav_chat">Chat</span>
                    <i class="fas fa-chevron-right text-[10px] text-surface-300 dark:text-surface-600"></i>
                    <span id="breadcrumb-page" class="font-medium text-surface-700 dark:text-surface-200 truncate" data-i18n="menu_chat">Chat</span>
                </div>

                <div class="flex-1"></div>

                <!-- Search (cosmetic placeholder — no command palette wired up yet) -->
                <div class="hidden md:flex items-center relative w-64">
                    <i class="fas fa-magnifying-glass text-xs text-surface-400 dark:text-surface-500 absolute left-3 pointer-events-none"></i>
                    <input type="text" id="header-search-input" placeholder="Search users, agents, records..."
                           class="w-full pl-8 pr-11 py-1.5 rounded-lg text-sm bg-surface-100 dark:bg-white/5 border border-transparent
                                  text-surface-600 dark:text-surface-300 placeholder-surface-400 dark:placeholder-surface-500
                                  focus:outline-none focus:bg-white dark:focus:bg-white/10 focus:border-surface-300 dark:focus:border-white/20
                                  transition-colors duration-150">
                    <span class="absolute right-2 text-[10px] font-medium px-1.5 py-0.5 rounded
                                 bg-white dark:bg-white/10 text-surface-400 dark:text-surface-500 border border-surface-200 dark:border-white/10
                                 pointer-events-none">⌘K</span>
                </div>

                <!-- Language Selector (dropdown) -->
                <div id="lang-selector" class="relative">
                    <button id="lang-toggle" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium
                                                     text-surface-500 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-white/10
                                                     cursor-pointer transition-colors duration-150"
                            onclick="toggleLangMenu(event)">
                        <i class="fas fa-globe text-xs"></i>
                        <span id="lang-label">EN</span>
                        <i class="fas fa-chevron-down text-[10px] opacity-60"></i>
                    </button>
                    <div id="lang-menu" class="hidden absolute right-0 mt-1 min-w-[120px] py-1 rounded-lg z-50
                                               bg-white dark:bg-surface-800 shadow-lg ring-1 ring-black/5 dark:ring-white/10">
                        <button class="lang-menu-item w-full text-left px-3 py-1.5 text-sm text-surface-600 dark:text-surface-300
                                       hover:bg-surface-100 dark:hover:bg-white/10 cursor-pointer" data-lang="en"
                                onclick="selectLanguage('en')">English</button>
                        <button class="lang-menu-item w-full text-left px-3 py-1.5 text-sm text-surface-600 dark:text-surface-300
                                       hover:bg-surface-100 dark:hover:bg-white/10 cursor-pointer" data-lang="ar"
                                onclick="selectLanguage('ar')">العربية</button>
                    </div>
                </div>

                <!-- Theme Toggle -->
                <button id="theme-toggle" class="p-2 w-9 h-9 flex items-center justify-center rounded-full text-surface-500 dark:text-surface-400
                                                  bg-surface-100 dark:bg-white/10
                                                  hover:bg-surface-200 dark:hover:bg-white/20
                                                  cursor-pointer transition-colors duration-150"
                        onclick="toggleTheme()">
                    <i id="theme-icon" class="theme-icon fas fa-moon"></i>
                </button>

                <!-- Notifications bell: Review Queue / Pending Edits / worktree
                     conflicts / scheduler run completions, aggregated server-side
                     by /api/notifications (agent/workspace/notifications.py) and
                     polled by core/notifications.js. Read/unread is tracked
                     client-side only -- see that file's own header comment. -->
                <div id="notif-center" class="relative">
                    <button id="notif-toggle" class="relative p-2 w-9 h-9 flex items-center justify-center rounded-full
                                                      text-surface-500 dark:text-surface-400
                                                      hover:bg-surface-100 dark:hover:bg-white/10
                                                      cursor-pointer transition-colors duration-150"
                            onclick="toggleNotificationMenu(event)"
                            aria-haspopup="true" aria-controls="notif-menu" aria-expanded="false"
                            aria-label="Notifications">
                        <i class="fas fa-bell text-sm"></i>
                        <span id="notif-badge" class="notif-badge hidden" aria-hidden="true"></span>
                    </button>
                    <div id="notif-menu" class="hidden absolute right-0 mt-1 w-80 max-h-[70vh] overflow-y-auto py-1
                                                 rounded-lg z-50 bg-white dark:bg-surface-800 shadow-lg
                                                 ring-1 ring-black/5 dark:ring-white/10 notif-menu"
                         role="region" aria-label="Notifications" aria-live="polite">
                        <div class="px-3 py-2 text-xs font-semibold text-surface-400 dark:text-surface-500
                                    uppercase tracking-wide" data-i18n="notif_menu_title">Notifications</div>
                        <div id="notif-list" class="px-2 pb-2 flex flex-col gap-1.5"></div>
                        <div id="notif-empty" class="activity-empty" data-i18n="notif_menu_empty">You're all caught up</div>
                    </div>
                </div>

                <!-- Profile menu (avatar + logout dropdown) -->
                <div id="profile-selector" class="relative">
                    <button id="profile-toggle" class="flex-shrink-0 cursor-pointer" title=""
                            onclick="toggleProfileMenu(event)"><span class="agent-avatar agent-avatar-32 agent-avatar-tone-1">A</span></button>
                    <div id="profile-menu" class="hidden absolute right-0 mt-1 min-w-[160px] py-1 rounded-lg z-50
                                                  bg-white dark:bg-surface-800 shadow-lg ring-1 ring-black/5 dark:ring-white/10">
                        <button class="w-full text-left px-3 py-1.5 text-sm text-surface-600 dark:text-surface-300
                                       hover:bg-surface-100 dark:hover:bg-white/10
                                       cursor-pointer flex items-center gap-2"
                                onclick="toggleProfileMenu(); navigateTo('settings', 'profile')">
                            <i class="fas fa-user text-xs"></i>
                            <span data-i18n="settings_nav_profile">Profile</span>
                        </button>
                        <button class="w-full text-left px-3 py-1.5 text-sm text-surface-600 dark:text-surface-300
                                       hover:bg-red-50 hover:text-red-500 dark:hover:bg-red-500/10 dark:hover:text-red-400
                                       cursor-pointer flex items-center gap-2"
                                onclick="handleLogout()" data-i18n-title="logout">
                            <i class="fas fa-sign-out-alt text-xs"></i>
                            <span data-i18n="logout">Logout</span>
                        </button>
                    </div>
                </div>
            </header>
