                <!-- ====================================================== -->
                <!-- VIEW: Review Queue (shared AI-flag review surface)      -->
                <!-- ====================================================== -->
                <div id="view-review-queue" class="view">
                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="max-w-4xl mx-auto">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-9 h-9 rounded-lg bg-primary-50 dark:bg-primary-900/30 flex items-center justify-center shrink-0">
                                    <i class="fas fa-flag text-primary-500 text-sm"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-bold text-surface-800 dark:text-surface-100" data-i18n="review_queue_title">Review Queue</h2>
                                    <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5" data-i18n="review_queue_desc">Findings raised by AI agents -- Quality, Revenue, VAT, Financial -- for you to review. Nothing here was auto-actioned.</p>
                                </div>
                            </div>

                            <div id="review-queue-status" class="text-sm mb-4 opacity-0 transition-opacity duration-150"></div>

                            <div class="flex items-center gap-2 mb-4">
                                <select id="rq-status-filter" onchange="loadReviewQueue()"
                                        class="px-2.5 py-1.5 text-xs rounded-lg border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800 text-surface-700 dark:text-surface-200 cursor-pointer">
                                    <option value="open" data-i18n="review_queue_filter_open">Open</option>
                                    <option value="" data-i18n="review_queue_filter_all">All</option>
                                    <option value="approved" data-i18n="review_queue_filter_approved">Approved</option>
                                    <option value="dismissed" data-i18n="review_queue_filter_dismissed">Dismissed</option>
                                </select>
                                <select id="rq-category-filter" onchange="loadReviewQueue()"
                                        class="px-2.5 py-1.5 text-xs rounded-lg border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800 text-surface-700 dark:text-surface-200 cursor-pointer">
                                    <option value="" data-i18n="review_queue_all_categories">All categories</option>
                                    <option value="quality">Quality</option>
                                    <option value="revenue">Revenue</option>
                                    <option value="vat_compliance">VAT Compliance</option>
                                    <option value="financial">Financial</option>
                                    <option value="inventory">Inventory</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div id="review-queue-list" class="space-y-2"></div>
                        </div>
                    </div>
                </div>
