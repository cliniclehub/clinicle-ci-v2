                <!-- ====================================================== -->
                <!-- SETTINGS PANE: Profile                                  -->
                <!-- ====================================================== -->
                <div id="view-settings-profile" class="settings-pane" data-settings-pane="profile">
                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="max-w-4xl mx-auto">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-9 h-9 rounded-lg bg-primary-50 dark:bg-primary-900/30 flex items-center justify-center shrink-0">
                                    <i class="fas fa-user text-primary-500 text-sm"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-bold text-surface-800 dark:text-surface-100" data-i18n="settings_profile_title">Profile</h2>
                                    <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5" data-i18n="settings_profile_desc">Your own account: sign-in email, password, and two-factor login</p>
                                </div>
                            </div>

                            <div id="settings-profile-status" class="text-sm mb-4 opacity-0 transition-opacity duration-150"></div>

                            <!-- Account -->
                            <div class="p-5 rounded-xl border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800 mb-5">
                                <h3 class="text-sm font-semibold text-surface-700 dark:text-surface-200 mb-1" data-i18n="settings_profile_account_title">Account</h3>
                                <p class="text-xs text-surface-400 dark:text-surface-500 mb-3" id="settings-profile-email"></p>
                                <span id="settings-profile-role" class="inline-block px-2 py-0.5 rounded-full text-[11px] font-medium bg-surface-100 dark:bg-surface-700 text-surface-500 dark:text-surface-400 mb-4"></span>
                                <div id="settings-profile-avatar" class="agent-avatar-picker mt-4"></div>
                            </div>

                            <!-- Change password -->
                            <div class="p-5 rounded-xl border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800 mb-5">
                                <h3 class="text-sm font-semibold text-surface-700 dark:text-surface-200 mb-3" data-i18n="settings_profile_password_title">Change password</h3>
                                <form id="settings-profile-password-form" class="space-y-2 max-w-sm" onsubmit="return false;">
                                    <input id="settings-profile-old-password" type="password" autocomplete="current-password"
                                           placeholder="Current password" data-i18n-placeholder="settings_profile_current_password"
                                           class="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-white/10 bg-surface-50 dark:bg-surface-900/40 text-sm text-surface-700 dark:text-surface-200 focus:outline-none focus:ring-2 focus:ring-primary-400/40">
                                    <input id="settings-profile-new-password" type="password" autocomplete="new-password"
                                           placeholder="New password (min. 8 characters)" data-i18n-placeholder="settings_profile_new_password"
                                           class="w-full px-3 py-2 rounded-lg border border-surface-200 dark:border-white/10 bg-surface-50 dark:bg-surface-900/40 text-sm text-surface-700 dark:text-surface-200 focus:outline-none focus:ring-2 focus:ring-primary-400/40">
                                    <button type="button" onclick="_settingsChangePassword()"
                                            class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-primary-500 hover:bg-primary-600 text-white cursor-pointer transition-colors">
                                        <span data-i18n="settings_profile_password_save">Update password</span>
                                    </button>
                                </form>
                            </div>

                            <!-- MFA -->
                            <div class="p-5 rounded-xl border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800">
                                <h3 class="text-sm font-semibold text-surface-700 dark:text-surface-200 mb-3" data-i18n="agents_org_mfa">Two-factor authentication</h3>
                                <div id="settings-profile-mfa"></div>
                            </div>
                        </div>
                    </div>
                </div>
