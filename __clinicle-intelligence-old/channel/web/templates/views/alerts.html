                <!-- ====================================================== -->
                <!-- VIEW: Alerts                                            -->
                <!-- ====================================================== -->
                <div id="view-alerts" class="view">
                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="max-w-6xl mx-auto">
                            <!-- Header -->
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-lg bg-primary-50 dark:bg-primary-900/30 flex items-center justify-center shrink-0">
                                        <i class="fas fa-bell text-primary-500 text-sm"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-xl font-bold text-surface-800 dark:text-surface-100" data-i18n="alerts_title">Alerts</h2>
                                        <p class="text-sm text-surface-500 dark:text-surface-400 mt-0.5" data-i18n="alerts_desc">Security and reliability signals from the tamper-evident audit log</p>
                                    </div>
                                </div>
                                <button onclick="loadAlertsView()"
                                        class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-surface-100 dark:bg-surface-700 hover:bg-surface-200 dark:hover:bg-surface-600 text-surface-600 dark:text-surface-300 cursor-pointer transition-colors shrink-0">
                                    <i class="fas fa-rotate text-[11px]"></i>
                                    <span data-i18n="alerts_refresh">Refresh</span>
                                </button>
                            </div>

                            <div id="alerts-status" class="text-sm mb-4 opacity-0 transition-opacity duration-150"></div>

                            <!-- Severity count row -->
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                                <div class="p-4 rounded-xl border border-red-200 dark:border-red-800/30 bg-red-50/60 dark:bg-red-900/10">
                                    <div id="alerts-count-critical" class="text-2xl font-bold text-red-600 dark:text-red-400">0</div>
                                    <div class="text-xs text-red-500 dark:text-red-400 mt-0.5" data-i18n="alerts_critical">Critical</div>
                                </div>
                                <div class="p-4 rounded-xl border border-amber-200 dark:border-amber-800/30 bg-amber-50/60 dark:bg-amber-900/10">
                                    <div id="alerts-count-high" class="text-2xl font-bold text-amber-600 dark:text-amber-400">0</div>
                                    <div class="text-xs text-amber-500 dark:text-amber-400 mt-0.5" data-i18n="alerts_high">High</div>
                                </div>
                                <div class="p-4 rounded-xl border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800">
                                    <div id="alerts-count-medium" class="text-2xl font-bold text-surface-700 dark:text-surface-200">0</div>
                                    <div class="text-xs text-surface-500 dark:text-surface-400 mt-0.5" data-i18n="alerts_medium">Medium</div>
                                </div>
                                <div class="p-4 rounded-xl border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800">
                                    <div id="alerts-count-info" class="text-2xl font-bold text-surface-500 dark:text-surface-400">0</div>
                                    <div class="text-xs text-surface-500 dark:text-surface-400 mt-0.5" data-i18n="alerts_info">Info</div>
                                </div>
                            </div>

                            <!-- Feed -->
                            <div class="p-5 rounded-xl border border-surface-200 dark:border-white/10 bg-white dark:bg-surface-800">
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="text-sm font-semibold text-surface-700 dark:text-surface-200" data-i18n="alerts_feed">Feed</h3>
                                    <span id="alerts-feed-count" class="px-2 py-0.5 rounded-full text-[11px] bg-surface-100 dark:bg-surface-700 text-surface-500 dark:text-surface-400 font-medium">0 alerts</span>
                                </div>
                                <div id="alerts-list" class="space-y-1.5 text-sm max-h-[32rem] overflow-y-auto"></div>
                            </div>
                        </div>
                    </div>
                </div>
