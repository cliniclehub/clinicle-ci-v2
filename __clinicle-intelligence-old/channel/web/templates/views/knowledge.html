                <!-- ====================================================== -->
                <!-- VIEW: Knowledge                                         -->
                <!-- ====================================================== -->
                <div id="view-knowledge" class="view">
                    <div class="flex-1 min-h-0 overflow-y-auto md:overflow-hidden p-4 md:p-8 lg:p-10 md:flex md:flex-col">
                        <div class="w-full max-w-[1600px] mx-auto md:flex-1 md:min-h-0 md:flex md:flex-col">

                            <!-- Header -->
                            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-4 md:flex-shrink-0">
                                <div class="flex items-start gap-2.5">
                                    <i class="fas fa-book text-surface-400 dark:text-surface-500 text-lg mt-0.5" aria-hidden="true"></i>
                                    <div>
                                        <h2 class="text-xl font-bold text-surface-800 dark:text-surface-100" data-i18n="knowledge_title">Knowledge</h2>
                                        <p id="knowledge-tagline" class="text-sm text-surface-500 dark:text-surface-400 mt-1"></p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 flex-wrap flex-shrink-0">
                                    <span id="knowledge-action-status" class="text-xs opacity-0 transition-opacity duration-200"></span>
                                    <button onclick="clearAllKnowledgeDocuments()"
                                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-surface-600 dark:text-surface-300 bg-white dark:bg-surface-800 border border-surface-200 dark:border-white/10 hover:bg-surface-50 dark:hover:bg-surface-700/50 cursor-pointer transition-colors">
                                        <i class="fas fa-trash-can text-[11px]"></i><span id="knowledge-clear-label"></span>
                                    </button>
                                    <button onclick="selectKnowledgeImportFiles()"
                                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-xs font-medium cursor-pointer transition-colors">
                                        <i class="fas fa-plus text-[11px]"></i><span id="knowledge-add-label"></span>
                                    </button>
                                    <div id="knowledge-new-menu" class="relative">
                                        <button onclick="toggleKnowledgeNewMenu(event)" title="More"
                                                class="w-7 h-7 flex items-center justify-center rounded-lg text-surface-400 hover:text-surface-600 hover:bg-surface-100 dark:hover:bg-white/10 dark:hover:text-surface-300 cursor-pointer transition-colors">
                                            <i class="fas fa-ellipsis-vertical text-xs"></i>
                                        </button>
                                        <div id="knowledge-new-menu-list"
                                             class="hidden absolute right-0 mt-1.5 w-44 z-50 bg-white dark:bg-[#0F2036] border border-surface-200 dark:border-white/10 rounded-lg shadow-lg py-1">
                                            <button onclick="createKnowledgeCategory(); closeKnowledgeNewMenu()"
                                                    class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-surface-600 dark:text-surface-300 hover:bg-surface-50 dark:hover:bg-white/5 cursor-pointer transition-colors">
                                                <i class="fas fa-folder-plus w-3.5 text-surface-400"></i><span data-i18n="knowledge_new_category">New category</span>
                                            </button>
                                            <button onclick="createKnowledgeDocument(); closeKnowledgeNewMenu()"
                                                    class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-surface-600 dark:text-surface-300 hover:bg-surface-50 dark:hover:bg-white/5 cursor-pointer transition-colors">
                                                <i class="fas fa-file-circle-plus w-3.5 text-surface-400"></i><span data-i18n="knowledge_new_document">New document</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <input id="knowledge-import-input" type="file" class="hidden" multiple accept=".md,.txt,text/markdown,text/plain">
                            </div>

                            <!-- Secondary utility row: agent scope, docs/graph tabs, search -->
                            <div id="knowledge-utility-row" class="hidden mb-4 md:flex-shrink-0">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                    <div class="flex items-center gap-2">
                                        <div id="knowledge-agent-select" class="cfg-dropdown cfg-dropdown-avatar cfg-dropdown-sm" tabindex="0" style="width: 220px;">
                                            <div class="cfg-dropdown-selected">
                                                <span class="cfg-dropdown-face"></span>
                                                <span class="cfg-dropdown-text">--</span>
                                                <i class="fas fa-chevron-down cfg-dropdown-arrow"></i>
                                            </div>
                                            <div class="cfg-dropdown-menu"></div>
                                        </div>
                                        <div class="flex items-center bg-surface-100 dark:bg-white/10 rounded-lg p-0.5">
                                            <button id="knowledge-tab-docs" onclick="switchKnowledgeTab('docs')"
                                                    class="knowledge-tab px-3 py-1.5 rounded-md text-xs font-medium cursor-pointer transition-colors duration-150 active">
                                                <i class="fas fa-folder-tree mr-1.5"></i><span data-i18n="knowledge_tab_docs">Documents</span>
                                            </button>
                                            <button id="knowledge-tab-graph" onclick="switchKnowledgeTab('graph')"
                                                    class="knowledge-tab px-3 py-1.5 rounded-md text-xs font-medium cursor-pointer transition-colors duration-150">
                                                <i class="fas fa-diagram-project mr-1.5"></i><span data-i18n="knowledge_tab_graph">Graph</span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="relative w-full sm:w-56">
                                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-surface-400 text-xs"></i>
                                        <input id="knowledge-search" type="text" placeholder="Search..."
                                               class="w-full pl-8 pr-3 py-1.5 text-xs bg-surface-50 dark:bg-white/5 border border-surface-200 dark:border-white/10 rounded-lg text-surface-700 dark:text-surface-200 placeholder-surface-400 dark:placeholder-surface-500 focus:outline-none focus:ring-1 focus:ring-primary-400/50"
                                               oninput="filterKnowledgeTree(this.value)">
                                    </div>
                                </div>
                            </div>

                            <!-- Empty state -->
                            <div id="knowledge-empty" class="flex flex-col items-center justify-center py-20">
                                <div class="w-16 h-16 rounded-2xl bg-emerald-50 dark:bg-emerald-900/20 flex items-center justify-center mb-4">
                                    <i class="fas fa-book text-emerald-400 text-xl"></i>
                                </div>
                                <p class="text-surface-500 dark:text-surface-400 font-medium" data-i18n="knowledge_loading">Loading knowledge base...</p>
                                <p class="text-sm text-surface-400 dark:text-surface-500 mt-1" data-i18n="knowledge_loading_desc">Knowledge pages will be displayed here</p>
                                <div id="knowledge-empty-guide" class="hidden mt-6 max-w-sm text-center">
                                    <p class="text-sm text-surface-500 dark:text-surface-400 mb-4" data-i18n="knowledge_empty_guide">Send documents, links or topics to the agent in chat, and it will automatically organize them into your knowledge base.</p>
                                    <button onclick="navigateTo('chat')"
                                            class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600
                                                   text-white text-sm font-medium cursor-pointer transition-colors duration-150">
                                        <i class="fas fa-message text-xs"></i>
                                        <span data-i18n="knowledge_go_chat">Start a conversation</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Documents panel -->
                            <div id="knowledge-panel-docs" class="hidden md:flex-1 md:min-h-0 md:flex md:flex-col">

                                <!-- Drop zone -->
                                <div id="knowledge-dropzone" onclick="selectKnowledgeImportFiles()"
                                     class="knowledge-dropzone flex flex-col items-center justify-center text-center py-10 px-6 mb-4 rounded-2xl cursor-pointer flex-shrink-0">
                                    <i class="fas fa-arrow-up-from-bracket text-2xl text-surface-300 dark:text-surface-600 mb-3"></i>
                                    <p id="knowledge-dropzone-title" class="text-sm font-bold text-surface-700 dark:text-surface-200"></p>
                                    <p id="knowledge-dropzone-hint" class="text-xs text-surface-400 dark:text-surface-500 mt-1"></p>
                                </div>

                                <!-- Status line -->
                                <p id="knowledge-stats" class="text-xs text-surface-400 dark:text-surface-500 mb-3 flex-shrink-0"></p>

                                <!-- Document list -->
                                <div id="knowledge-sidebar" class="w-full md:flex-1 md:min-h-0">
                                    <div class="bg-white dark:bg-[#0F2036] rounded-xl border border-surface-200 dark:border-white/10 overflow-hidden flex flex-col md:h-full">
                                        <div id="knowledge-tree" class="px-3 md:px-4 overflow-y-auto flex-1"></div>
                                    </div>
                                </div>

                                <!-- Content viewer (modal) -->
                                <div id="knowledge-content-placeholder"
                                     class="hidden flex flex-col items-center justify-center py-20 text-surface-400 dark:text-surface-500 bg-white dark:bg-[#0F2036] rounded-xl border border-surface-200 dark:border-white/10">
                                    <i class="fas fa-file-lines text-3xl mb-3 opacity-40"></i>
                                    <p class="text-sm" data-i18n="knowledge_select_hint">Select a document to view</p>
                                </div>
                                <div id="knowledge-content-viewer" class="hidden">
                                    <div class="bg-white dark:bg-[#0F2036] rounded-xl border border-surface-200 dark:border-white/10 overflow-hidden flex flex-col">
                                        <div class="flex items-center gap-3 px-4 md:px-5 py-3 border-b border-surface-200 dark:border-white/10 flex-shrink-0">
                                            <i class="fas fa-file-lines text-surface-400 text-sm"></i>
                                            <span id="knowledge-viewer-title" class="text-sm font-medium text-surface-700 dark:text-surface-200 truncate"></span>
                                            <span id="knowledge-viewer-path" class="text-xs text-surface-400 dark:text-surface-500 ml-auto font-mono truncate hidden md:inline"></span>
                                            <button onclick="knowledgeMobileBack()" class="p-1 -mr-1 text-surface-400 hover:text-surface-600 dark:hover:text-surface-300 cursor-pointer">
                                                <i class="fas fa-xmark text-sm"></i>
                                            </button>
                                        </div>
                                        <div id="knowledge-viewer-body"
                                             class="p-4 md:p-5 overflow-y-auto flex-1 text-sm msg-content text-surface-700 dark:text-surface-200"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Graph panel -->
                            <div id="knowledge-panel-graph" class="hidden">
                                <div class="bg-white dark:bg-[#0F2036] rounded-xl border border-surface-200 dark:border-white/10 overflow-hidden">
                                    <div id="knowledge-graph-container" class="w-full h-[60dvh] md:h-[calc(100dvh-220px)]"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
